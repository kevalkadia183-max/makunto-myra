<!-- Makunto hero — modular section for the Horizon website.
     Self-contained: scoped styles, no dependencies. Copy the whole block.
     Replace ORB_IMG with the site path to launch/brand/app-icon-1024.png
     (or embed launch/brand/logo-mark.svg inline). -->
<section class="mk-hero">
  <style>
    .mk-hero{background:radial-gradient(1200px 600px at 70% -10%,#2a1b4a 0%,#151021 45%,#0b0714 100%);color:#f4f1fa;padding:96px 24px 80px;text-align:center;font-family:-apple-system,'Segoe UI',Roboto,Inter,sans-serif}
    .mk-hero .mk-orb{width:140px;height:140px;border-radius:50%;margin:0 auto 32px;display:block;filter:drop-shadow(0 0 42px rgba(139,92,246,.55));animation:mkBreathe 4s ease-in-out infinite}
    @keyframes mkBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
    .mk-hero h1{font-size:clamp(32px,6vw,56px);font-weight:700;margin:0 0 16px;letter-spacing:-.02em}
    .mk-hero h1 em{font-style:normal;background:linear-gradient(90deg,#a78bfa,#7c3aed);-webkit-background-clip:text;background-clip:text;color:transparent}
    .mk-hero p{font-size:clamp(16px,2.4vw,20px);color:#b8b2cc;max-width:640px;margin:0 auto 36px;line-height:1.55}
    .mk-hero .mk-cta{display:inline-block;background:linear-gradient(135deg,#8b5cf6,#7c3aed);color:#fff;font-weight:600;font-size:17px;padding:15px 34px;border-radius:999px;text-decoration:none;box-shadow:0 8px 30px rgba(124,58,237,.4);transition:transform .15s ease}
    .mk-hero .mk-cta:hover{transform:translateY(-2px)}
    .mk-hero .mk-sub{display:block;margin-top:18px;color:#8a84a0;font-size:13px}
    @media (prefers-reduced-motion:reduce){.mk-hero .mk-orb{animation:none}}
  </style>
  <img class="mk-orb" src="ORB_IMG" alt="Myra — the Makunto voice orb">
  <h1>Talk to your <em>analytics</em>.</h1>
  <p>Makunto Myra watches your YouTube, Instagram and Facebook, explains what changed and why, and tells you what to do next — out loud.</p>
  <a class="mk-cta" href="https://makuntovoice.replit.app">Open Makunto Myra</a>
  <span class="mk-sub">Free to try · Coming soon to the App Store &amp; Google Play</span>
</section>
